[project]
name = "cfa635"
version = "0.1.0"
description = "Driver and LAN API server for the Crystalfontz CFA635 20x4 LCD"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",  # uvicorn's WS protocol impl; without it /ws 404s
]

[project.scripts]
cfa635-probe = "cfa635.probe:main"
cfa635-server = "cfa635.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pypdf>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
